<title>キングショット 連凸計算</title>
<style>
  :root{
    --bg:#060912; --bg2:#0d1630;
    --panel:rgba(22,30,50,.72); --panel2:rgba(30,40,66,.78); --inset:#05080f;
    --line:rgba(148,170,210,.16); --line2:rgba(148,170,210,.28);
    --text:#f1f4fa; --sub:#8b97b0;
    --gold:#f5c84c; --gold2:#d99a1e; --gold-l:#ffe9a8; --gold-d:rgba(245,200,76,.12);
    --r1:#3cc4ff; --r2:#ff5470; --r3:#4ade80; --ok:#34e39a; --err:#ff5c6c;
    --fs:1; --gap:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;color:var(--text)}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(60,110,220,.28), transparent 60%),
      radial-gradient(70% 40% at 100% 100%, rgba(245,200,76,.07), transparent 70%),
      linear-gradient(180deg,var(--bg2) 0%,var(--bg) 45%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
    padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);
    -webkit-text-size-adjust:100%; font-size:calc(15px * var(--fs));
  }
  button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  .wrap{margin:0 auto;max-width:480px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:.02em}

  /* デバイス切替 */
  .device{display:flex;gap:4px;background:rgba(10,15,28,.7);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:18px}
  .device button{flex:1;border:0;background:transparent;color:var(--sub);font-size:12px;padding:6px 2px;border-radius:7px;white-space:nowrap}
  .device button.on{background:linear-gradient(180deg,rgba(245,200,76,.18),rgba(245,200,76,.06));color:var(--gold-l);box-shadow:inset 0 0 0 1px rgba(245,200,76,.35)}
  .device .cur{font-size:10px}

  .ver{text-align:right;font-size:12px;color:var(--gold);letter-spacing:.08em;opacity:.85;margin:2px 2px -4px}
  h1{font-size:calc(20px * var(--fs));margin:6px 0 10px;text-align:center;font-weight:900;letter-spacing:.08em;
     text-shadow:0 2px 12px rgba(60,120,255,.35)}
  h1 span{background:linear-gradient(180deg,var(--gold-l),var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}

  .grid{display:block}
  .col > * + *{margin-top:var(--gap)}

  /* セクション見出し */
  .sec > * + *{margin-top:7px}
  .col > .sec + .sec, .grid > .col + .col{margin-top:20px}
  .sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:calc(15px * var(--fs));letter-spacing:.06em}
  .sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(245,200,76,.55),rgba(245,200,76,0))}
  .sec-h .no{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:6px;transform:rotate(45deg);
    background:linear-gradient(135deg,var(--gold-l),var(--gold) 50%,var(--gold2));color:#1b1200;font-size:calc(12px * var(--fs));font-weight:900;
    box-shadow:0 0 10px rgba(245,200,76,.35);margin:0 3px}
  .sec-h .no > i{transform:rotate(-45deg);font-style:normal}

  /* 共通パネル（左に色帯） */
  .in,.arr,.card{
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--r1);border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .in.r2,.arr.r2,.card.r2{border-left-color:var(--r2)}
  .in.r1,.arr.r1,.card.r1{background:linear-gradient(90deg,rgba(60,196,255,.10),transparent 55%),var(--panel)}
  .in.r2,.arr.r2,.card.r2{background:linear-gradient(90deg,rgba(255,84,112,.10),transparent 55%),var(--panel)}

  /* 入力 */
  .inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .in{padding:8px 10px}
  .in label{display:flex;justify-content:space-between;align-items:center;font-size:calc(13px * var(--fs));font-weight:800}
  .in label .tag{display:none}
  .in.r1 label{color:var(--r1)} .in.r2 label{color:var(--r2)}
  .in input{
    width:100%;margin-top:5px;background:var(--inset);color:var(--text);border:1px solid var(--line2);border-radius:10px;
    font-size:calc(30px * var(--fs));font-weight:800;text-align:center;padding:6px 4px;letter-spacing:.12em;outline:none;
    font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);transition:border-color .15s, box-shadow .15s;
  }
  .in input:focus{border-color:var(--gold);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 3px rgba(245,200,76,.18)}
  .in input::placeholder{font-size:calc(12px * var(--fs));letter-spacing:0;font-weight:400;color:#56617a}
  .in.bad input{border-color:var(--err);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 3px rgba(255,92,108,.18)}
  .in .conv{margin-top:4px;text-align:center;font-size:calc(12px * var(--fs));color:var(--sub);min-height:1.3em}
  .in.bad .conv{color:var(--err)}

  /* 着弾設定 */
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .modes button{
    background:rgba(14,20,36,.8);border:1px solid var(--line2);border-radius:12px;padding:9px 4px;min-height:52px;
    font-size:calc(13px * var(--fs));font-weight:700;line-height:1.25;color:var(--sub);transition:all .15s
  }
  .modes button.on{
    background:linear-gradient(180deg,rgba(245,200,76,.34),rgba(245,200,76,.10));border-color:var(--gold);color:var(--gold-l);
    box-shadow:0 0 14px rgba(245,200,76,.25), inset 0 1px 0 rgba(255,233,168,.25)
  }
  .modes button.on::before{content:"✔ "}

  /* 着弾時間 */
  .arrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .arr{padding:6px 9px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
  .arr .k{font-size:calc(11px * var(--fs));color:var(--sub);width:100%}
  .arr .v{font-size:calc(20px * var(--fs));font-weight:800}

  /* 集結時間（外枠なし） */
  .result{background:none;border:0;padding:0}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:9px 10px}
  .card .name{font-weight:800;font-size:calc(14px * var(--fs))}
  .card.r1 .name{color:var(--r1)} .card.r2 .name{color:var(--r2)}
  .card .big{font-size:calc(34px * var(--fs));font-weight:900;line-height:1.15;text-align:center;margin:4px 0 2px;color:var(--text)}
  .card .big.pos{background:linear-gradient(180deg,var(--gold-l),var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 8px rgba(245,200,76,.35))}
  .first[hidden]{display:none !important}
  .first{display:inline-block;font-size:calc(10px * var(--fs));background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#1b1200;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:2px}
  .arr .first{margin-left:0}
  .explain{margin-top:8px;background:rgba(5,8,15,.75);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:calc(13px * var(--fs));line-height:1.55;text-align:center;color:#cfd6e4}
  .explain .em{color:var(--gold);font-weight:800}
  .result.err .explain{color:var(--err);border-color:rgba(255,92,108,.4)}

  /* コピー */
  .copy{
    position:relative;overflow:hidden;width:100%;border:0;border-radius:14px;padding:16px 8px;font-size:calc(20px * var(--fs));font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#ffe28a 0%,#f5c84c 40%,#d99a1e 100%);color:#1b1200;
    box-shadow:0 4px 0 #8a5c00,0 8px 24px rgba(245,200,76,.28), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .copy::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
  @keyframes shine{0%,70%{left:-60%}100%{left:130%}}
  .copy:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5c00,0 4px 12px rgba(245,200,76,.25)}
  .copy.done{background:linear-gradient(180deg,#7ff5bd,#34e39a 50%,#1fae6f);box-shadow:0 4px 0 #11663f,0 8px 24px rgba(52,227,154,.28)}
  .copy:disabled{background:#2a3140;color:#6b7488;box-shadow:none}
  .copy:disabled::after{display:none}
  .manual{display:none;background:var(--panel);border:1px dashed var(--gold);border-radius:12px;padding:8px}
  .manual.show{display:block}
  .manual p{margin:0 0 6px;font-size:calc(12px * var(--fs));color:var(--gold)}
  .manual textarea{width:100%;min-height:96px;background:var(--inset);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px;font-size:15px;font-family:inherit;resize:vertical}
  .reset{width:100%;background:rgba(10,15,28,.6);border:1px solid var(--line2);border-radius:12px;padding:10px;font-size:calc(15px * var(--fs));color:var(--sub);font-weight:700;letter-spacing:.06em}
  .reset:active{background:var(--panel2);color:var(--text)}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;
    background:linear-gradient(180deg,#7ff5bd,#34e39a);color:#00301a;font-weight:900;padding:12px 22px;border-radius:999px;transition:.25s;pointer-events:none;z-index:9;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== タブレット ===== */
  body.d-tablet{--fs:1.18;--gap:14px}
  body.d-tablet .wrap{max-width:760px}
  body.d-tablet .device button{font-size:14px;padding:8px}
  body.d-tablet .modes button{min-height:62px}
  body.d-tablet .card{padding:12px}
  body.d-tablet .col > .sec + .sec, body.d-tablet .grid > .col + .col{margin-top:26px}

  /* ===== PC ===== */
  body.d-pc{--fs:1.1;--gap:14px;padding-top:16px;padding-bottom:24px}
  body.d-pc .wrap{max-width:820px}
  body.d-pc h1{font-size:28px;margin:10px 0 18px}
  body.d-pc .col > .sec + .sec, body.d-pc .grid > .col + .col{margin-top:24px}
  body.d-pc .copy:hover:not(:disabled){filter:brightness(1.06)}
  body.d-pc .modes button:hover:not(.on),body.d-pc .reset:hover{border-color:rgba(245,200,76,.5);color:var(--text)}
  body.d-pc .kbd{display:inline}
  .kbd{display:none;color:var(--sub);font-size:11px;font-weight:400}

  /* ===== 3凸対応 ===== */
  .in.r3,.arr.r3,.card.r3{border-left-color:var(--r3);background:linear-gradient(90deg,rgba(74,222,128,.10),transparent 55%),var(--panel)}
  .in.r3 label,.card.r3 .name{color:var(--r3)}
  .arr.r1 .rn{color:var(--r1)} .arr.r2 .rn{color:var(--r2)} .arr.r3 .rn{color:var(--r3)}
  .inputs,.cards{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
  body.n3 .in input{font-size:calc(25px * var(--fs));letter-spacing:.06em;padding:7px 2px}
  body.n3 .card .big{font-size:calc(27px * var(--fs))}
  body.n3 .in{padding:7px 7px}
  body.n3 .card{padding:8px 7px}
  .hide{display:none !important}
  .in label,.card .name{font-size:calc(17px * var(--fs)) !important;font-weight:900}
  /* 凸数切替 */
  .cnt{margin-left:auto;display:flex;background:rgba(10,15,28,.7);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px}
  .cnt button{border:0;background:transparent;color:var(--sub);font-weight:800;font-size:calc(12px * var(--fs));padding:4px 11px;border-radius:7px;letter-spacing:.04em}
  .cnt button.on{background:linear-gradient(180deg,rgba(245,200,76,.34),rgba(245,200,76,.10));color:var(--gold-l);box-shadow:inset 0 0 0 1px rgba(245,200,76,.5)}
  .sec-h.has-ctl::after{display:none}
  /* 着弾順 */
  .arrs{display:flex;flex-direction:column;gap:6px}

<script>
(function(){
  "use strict";
  var MAX = 3;
  var LEAD = 2;                 // 着弾順1つごとの間隔（秒）
  var RESET_VAL = "00:00";      // リセット時の行軍時間
  var INIT = ["05:01", "04:56", "04:50"];
  var ZD = ["０","１","２","３","４","５","６","７","８","９"];
  var DEFAULT_N = 2;            // 標準の凸数
  var n = DEFAULT_N;            // 凸数
  var rank = [1, 1, 1];         // 着弾順（1=最初）
  var latestCopyText = "";

  /* ---------- 計算ロジック ---------- */
  function parse4(str){
    if (!/^\d{4}$/.test(str)) return null;
    var m = parseInt(str.slice(0,2),10), s = parseInt(str.slice(2),10);
    if (s > 59) return null;
    return m*60 + s;
  }
  function pad(x){ return (x < 10 ? "0" : "") + x; }
  function fmtMS(sec){ return pad(Math.floor(sec/60)) + ":" + pad(sec%60); }
  // t: 行軍秒の配列, rk: 着弾順の配列
  // 着弾 = 基準A + (順位-1)×LEAD、出発 = 着弾 − 行軍。最初に出発する集結を 00:00 にする
  function calc(t, rk){
    var off = rk.map(function(r){ return (r - 1) * LEAD; });
    // 一番早い着弾順を基準(0秒)に詰める（全員②なら同時着弾と同じ）
    var minOff = Math.min.apply(null, off);
    off = off.map(function(o){ return o - minOff; });
    var A = -Infinity;
    for (var i=0;i<t.length;i++) A = Math.max(A, t[i] - off[i]);
    return t.map(function(ti, i){ return { dep: A + off[i] - ti, arr: A + off[i], off: off[i] }; });
  }
  function zen(str){
    return str.replace(/[0-9]/g, function(c){ return ZD[+c]; }).replace(/:/g, "：");
  }
  var CN = ["⓪","①","②","③"];  // 丸数字
  // 秒数の表記：1桁は全角（８）、2桁以上は半角（33）
  function secNum(x){ return x < 10 ? ZD[x] : String(x); }
  function secTxt(x){
    if (x < 60) return secNum(x) + "秒後";
    var m = Math.floor(x/60), sc = x % 60;
    return secNum(m) + "分" + (sc ? secNum(sc) + "秒" : "") + "後";
  }
  // 順番の表記（例 ③→ ②８秒後→①33秒後）。同じタイミングは「＝」、最初は秒数なし
  function orderLine(vals){
    var uq = vals.filter(function(v,i){ return vals.indexOf(v) === i; }).sort(function(a,b){ return a-b; });
    var parts = uq.map(function(u, k){
      var g = []; vals.forEach(function(v,i){ if (v === u) g.push(CN[i+1]); });
      return g.join("＝") + (k ? secTxt(u - uq[0]) : "");
    });
    return parts[0] + (parts.length > 1 ? "→" + parts.slice(1).join("→") : "");
  }
  // チャットで改行されないよう、時間は半角（例 05:01）で出力
  function buildCopy(t, r){
    var S = "\u3000";
    var head = "・領主", dp = "●集結", mv = "・行軍", ar = "・着弾";
    for (var i=0;i<t.length;i++){
      head += S + S + CN[i+1];
      dp += S + fmtMS(r[i].dep);
      mv += S + fmtMS(t[i]);
      ar += S + fmtMS(r[i].arr);
    }
    return "【連凸タイミング】\n" +
      "【出発】" + orderLine(r.map(function(x){ return x.dep; })) + "\n" +
      "【着弾】" + orderLine(r.map(function(x){ return x.arr; })) + "\n" +
      head + "\n" + dp + "\n" + mv + "\n" + ar + "\n";
  }
  window.RentotsuCalc = { parse4:parse4, fmtMS:fmtMS, calc:calc, buildCopy:buildCopy };

  /* ---------- 画面の組み立て ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var inputsEl = $("inputs"), arrsEl = $("arrs"), cardsEl = $("cards");
  for (var i=1;i<=MAX;i++){
    inputsEl.insertAdjacentHTML("beforeend",
      '<div class="in r'+i+'" id="box'+i+'"><label for="t'+i+'"><span>'+i+'</span></label>' +
      '<input id="t'+i+'" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例：0308" value="'+INIT[i-1]+'">' +
      '<div class="conv num" id="c'+i+'"></div></div>');
    arrsEl.insertAdjacentHTML("beforeend",
      '<div class="arr r'+i+'" id="row'+i+'"><span class="rn">'+i+'</span>' +
      '<div class="rank" data-i="'+(i-1)+'"><button data-r="1">①</button><button data-r="2">②</button><button data-r="3" class="r3b">③</button></div>' +
      '<div class="at"><span class="k">着弾</span><span class="v num" id="a'+i+'">--:--</span><span class="lag" id="l'+i+'"></span></div></div>');
    cardsEl.insertAdjacentHTML("beforeend",
      '<div class="card r'+i+'" id="card'+i+'"><div class="name">'+i+'<span class="first" id="f'+i+'" hidden>先発</span></div>' +
      '<div class="big num" id="d'+i+'">--:--</div></div>');
  }
  var inputs = [$("t1"), $("t2"), $("t3")];
  var copyBtn = $("copyBtn");

  function sanitize(el){
    var v = el.value.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
                    .replace(/[^0-9]/g,"");
    var prev = el.getAttribute("data-prev") || "";
    if (v.length > 4) v = (prev.length === 4 && v.indexOf(prev) === 0) ? v.slice(4, 8) : v.slice(0, 4);
    el.setAttribute("data-prev", v);
    var shown = (v.length === 4 && parse4(v) !== null) ? v.slice(0,2) + ":" + v.slice(2) : v;
    if (shown !== el.value) el.value = shown;
    return v;
  }
  function inputState(raw, box, conv){
    var sec = parse4(raw);
    if (sec === null){
      box.classList.add("bad");
      if (raw.length < 4) conv.textContent = raw.length === 0 ? "入力してください" : "4桁で入力";
      else conv.textContent = "秒は00〜59";
    } else {
      box.classList.remove("bad");
      conv.textContent = Math.floor(sec/60) + "分" + (sec%60) + "秒";
    }
    return sec;
  }
  function gapTxt(x){ return x >= 60 ? Math.floor(x/60) + "分" + (x%60 ? (x%60) + "秒" : "") : x + "秒"; }

  function render(){
    // 凸数の反映
    document.body.classList.toggle("n3", n === 3);
    document.querySelector(".wrap").style.setProperty("--n", n);
    for (var i=1;i<=MAX;i++){
      var show = i <= n;
      $("box"+i).classList.toggle("hide", !show);
      $("row"+i).classList.toggle("hide", !show);
      $("card"+i).classList.toggle("hide", !show);
    }
    document.querySelectorAll(".r3b").forEach(function(b){ b.classList.toggle("hide", n < 3); });
    document.querySelectorAll(".cnt button").forEach(function(b){
      var on = +b.getAttribute("data-n") === n; b.classList.toggle("on", on); b.setAttribute("aria-checked", on);
    });
    document.querySelectorAll(".rank").forEach(function(g){
      var k = +g.getAttribute("data-i");
      g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", +b.getAttribute("data-r") === rank[k]); });
    });
    var rk = rank.slice(0, n);
    $("sameBtn").classList.toggle("on", rk.every(function(r){ return r === rk[0]; }));

    var t = [];
    for (i=0;i<n;i++) t.push(inputState(sanitize(inputs[i]), $("box"+(i+1)), $("c"+(i+1))));
    var res = $("result");
    if (t.some(function(x){ return x === null; })){
      res.classList.add("err");
      for (i=1;i<=MAX;i++){
        $("d"+i).textContent = "--:--"; $("d"+i).classList.remove("pos");
        $("a"+i).textContent = "--:--"; $("l"+i).textContent = ""; $("f"+i).hidden = true;
      }
      $("explain").textContent = "⚠ 入力エラー：行軍時間を4桁（分2桁＋秒2桁、秒は00〜59）で入力してください";
      latestCopyText = ""; copyBtn.disabled = true; $("manual").classList.remove("show");
      return;
    }
    res.classList.remove("err"); copyBtn.disabled = false;
    var r = calc(t, rk);
    var allSameDep = r.every(function(x){ return x.dep === 0; });
    var allSameArr = r.every(function(x){ return x.off === 0; });
    for (i=0;i<n;i++){
      var k = i + 1;
      $("d"+k).textContent = fmtMS(r[i].dep);
      $("d"+k).classList.toggle("pos", r[i].dep > 0);
      $("a"+k).textContent = fmtMS(r[i].arr);
      $("l"+k).textContent = r[i].off > 0 ? "+" + r[i].off + "秒" : (allSameArr ? "" : "先着");
      $("f"+k).hidden = allSameDep || r[i].dep !== 0;
    }

    // 説明文：出発順と着弾
    // 同じ秒数は「1＝2」のようにまとめて表示（出発・着弾とも同じ書式）
    function seq(vals, label){
      var uq = vals.filter(function(v,j){ return vals.indexOf(v) === j; }).sort(function(a,b){ return a-b; });
      return "<span class='ln'><span class='lbl'>" + label + "</span>" + uq.map(function(u){
        var g = []; vals.forEach(function(v,j){ if (v === u) g.push(j+1); });
        // 全員同じタイミング（1グループだけ）なら「（最初）」は付けない
        return g.join("＝") + (u ? "<span class='em'>（" + gapTxt(u) + "後）</span>" : (uq.length > 1 ? "（最初）" : ""));
      }).join(" → ") + "</span>";
    }
    var dep = seq(r.map(function(x){ return x.dep; }), "出発");
    var arr;
    arr = seq(r.map(function(x){ return x.off; }), "着弾");
    $("explain").innerHTML = dep + arr;

    latestCopyText = buildCopy(t, r);
    if ($("manual").classList.contains("show")) $("manualText").value = latestCopyText;
  }

  /* ---------- コピー ---------- */
  var toastTimer;
  function success(){
    $("manual").classList.remove("show");
    var tt = $("toast"); tt.classList.add("show");
    copyBtn.classList.add("done"); copyBtn.querySelector(".cp-main").textContent = "✅ コピーしました！";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      tt.classList.remove("show"); copyBtn.classList.remove("done");
      copyBtn.querySelector(".cp-main").textContent = "📋 計算結果コピー";
    }, 1600);
  }
  function legacyCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
    document.body.appendChild(ta);
    var ok = false;
    try{
      ta.contentEditable = "true"; ta.readOnly = false;
      var range = document.createRange(); range.selectNodeContents(ta);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      sel.removeAllRanges();
    }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function showManual(text){
    var m = $("manual"), ta = $("manualText");
    ta.value = text; m.classList.add("show");
    setTimeout(function(){ try{ ta.focus(); ta.setSelectionRange(0, text.length); }catch(e){} }, 50);
  }
  function doCopy(){
    render();
    var text = latestCopyText;
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(success, function(){
        if (legacyCopy(text)) success(); else showManual(text);
      });
    } else {
      if (legacyCopy(text)) success(); else showManual(text);
    }
  }

  /* ---------- デバイス表示切替 ---------- */
  var devPref = "auto";
  try{ devPref = localStorage.getItem("rentotsu_device") || "auto"; }catch(e){}
  function autoDevice(){
    var touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
    if (window.innerWidth < 600) return "phone";
    if (touch && window.innerWidth < 1200) return "tablet";
    if (window.innerWidth < 900) return "tablet";
    return "pc";
  }
  var DEV_LABEL = {phone:"📱", tablet:"📲", pc:"💻"};
  function applyDevice(){
    var d = devPref === "auto" ? autoDevice() : devPref;
    document.body.classList.remove("d-phone","d-tablet","d-pc");
    document.body.classList.add("d-" + d);
    $("autoCur").textContent = devPref === "auto" ? DEV_LABEL[d] : "";
    document.querySelectorAll(".device button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-dev") === devPref); });
  }

  /* ---------- イベント ---------- */
  inputs.forEach(function(el, idx){
    el.addEventListener("input", render);
    var selAll = function(){ setTimeout(function(){ try{ el.setSelectionRange(0, el.value.length); }catch(e){} }, 0); };
    el.addEventListener("focus", selAll);
    el.addEventListener("click", selAll);
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter" && !(e.ctrlKey || e.metaKey)){
        e.preventDefault();
        if (idx + 1 < n) inputs[idx + 1].focus(); else el.blur();
      }
    });
  });
  document.querySelectorAll(".rank").forEach(function(g){
    var k = +g.getAttribute("data-i");
    g.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){ rank[k] = +b.getAttribute("data-r"); render(); });
    });
  });
  $("sameBtn").addEventListener("click", function(){ rank = [1,1,1]; render(); });
  document.querySelectorAll(".cnt button").forEach(function(b){
    b.addEventListener("click", function(){
      n = +b.getAttribute("data-n");
      if (n < 3 && rank[2] === 3) rank[2] = 1;
      rank = rank.map(function(r){ return Math.min(r, n); });
      $("manual").classList.remove("show"); render();
    });
  });
  copyBtn.addEventListener("click", doCopy);
  $("resetBtn").addEventListener("click", function(){
    inputs.forEach(function(el){ el.value = RESET_VAL; el.setAttribute("data-prev",""); });
    rank = [1,1,1]; n = DEFAULT_N;
    $("manual").classList.remove("show"); render();
  });
  document.querySelectorAll(".device button").forEach(function(b){
    b.addEventListener("click", function(){
      devPref = b.getAttribute("data-dev");
      try{ localStorage.setItem("rentotsu_device", devPref); }catch(e){}
      applyDevice();
    });
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); doCopy(); }
  });
  window.addEventListener("resize", applyDevice);
  window.addEventListener("orientationchange", applyDevice);

  /* ---------- メモ（英雄遠征スキル） ---------- */
  // [世代, 英雄, レア度, 区分, 適用, 効果, 最大, 補足]
  var MEMO = [
    { title:"１．攻撃系", cls:"atk", rows:[
      ["1", "チェンコ", "エピック", "攻撃", "味方", "殺傷力上昇", "25%", ""],
      ["1", "あまね", "エピック", "攻撃", "味方", "攻撃力上昇", "25%", ""],
      ["1", "インウー", "エピック", "攻撃", "味方", "殺傷力上昇", "25%", ""],
      ["1", "アマデウス", "レジェンド", "攻撃", "味方", "殺傷力上昇", "25%", ""],
      ["2", "ゾーイ", "レジェンド", "攻撃", "敵", "裂傷を付与", "40%", "発動率20%、3ターン"],
      ["2", "マリン", "レジェンド", "攻撃", "味方", "与ダメージ上昇", "50%", "発動率40%"],
      ["2", "ヒルデ", "レジェンド", "攻防", "味方", "攻撃力・防御力上昇", "15%・10%", ""],
      ["3", "ペーラ", "レジェンド", "攻撃", "敵", "被ダメージ上昇", "50%", "発動率50%"],
      ["3", "イェーガー", "レジェンド", "攻撃", "味方", "与ダメージ上昇", "40%", "発動率20%、3ターン"],
      ["4", "マーゴ", "レジェンド", "攻撃", "味方", "攻撃力上昇", "25%", ""],
      ["4", "ローザ", "レジェンド", "攻撃", "味方", "与ダメージ上昇", "50%", "発動率40%"],
      ["5", "ビビアン", "レジェンド", "攻撃", "敵", "被ダメージ上昇", "25%", ""],
      ["5", "スルード", "レジェンド", "攻防", "味方", "被ダメージ軽減・与ダメージ上昇", "15%・15%", "歩兵・弓兵が対象"],
      ["6", "ヤン", "レジェンド", "攻撃", "味方", "追加ダメージ", "100%", "4ターンごとの追加攻撃"],
      ["7", "アイヴァ", "レジェンド", "攻撃", "敵", "防御力低下", "25%", ""],
      ["7", "レン&ロン", "レジェンド", "攻撃", "味方", "攻撃力・殺傷力上昇", "15%・10%", ""],
      ["8", "リズ", "レジェンド", "攻撃", "味方", "殺傷力上昇", "50%", "発動率50%"],
      ["8", "ルナ", "レジェンド", "攻撃", "味方", "攻撃力上昇", "25%", ""]
    ]},
    { title:"２．防衛系", cls:"def", rows:[
      ["1", "クイン", "エピック", "防衛", "味方", "被ダメージ軽減", "20%", ""],
      ["1", "ハワード", "エピック", "防衛", "味方", "被ダメージ軽減", "20%", ""],
      ["1", "ゴードン", "エピック", "防衛", "味方", "総HP上昇", "25%", ""],

  });
  function fitMemoHead(){
    var h = document.querySelector(".memo-head");
    document.querySelector(".memo-box").style.setProperty("--mh", (h.getBoundingClientRect().height - 13) + "px");
  }
  // スキル一覧表：タブ・見出し・兵種ボタン・兵種の帯・項目名の行を、スクロールしても上に留める
  function fitSkSticky(){
    var box = document.querySelector(".memo-box"), head = document.querySelector(".memo-head"), sb = box.querySelector(".sk-sticky");
    if (!sb || $("memoOv").hidden) return;
    var t1 = head.offsetHeight - 12;                     // .memo-head は top:-12px で固定
    var t2 = t1 + sb.offsetHeight;                       // 兵種の帯
    var gr = box.querySelector(".sk-grp:not([hidden]) tr.grp-row");
    var t3 = t2 + (gr ? gr.offsetHeight : 0);            // 項目名の行
    box.style.setProperty("--sk1", t1 + "px"); box.style.setProperty("--sk2", t2 + "px"); box.style.setProperty("--sk3", t3 + "px");
  }
  function openMemo(){ $("memoOv").hidden = false; document.body.classList.add("memo-open"); fitMemoHead(); fitSkSticky(); $("memoClose").focus(); }
  window.addEventListener("resize", function(){ if (!$("memoOv").hidden){ fitMemoHead(); fitSkSticky(); } });
  function closeMemo(){ $("memoOv").hidden = true; document.body.classList.remove("memo-open"); $("memoBtn").focus(); }
  $("memoBtn").addEventListener("click", openMemo);
  $("memoClose").addEventListener("click", closeMemo);
  $("memoOv").addEventListener("click", function(e){ if (e.target === this) closeMemo(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("memoOv").hidden) closeMemo(); });

  applyDevice();
  render();
})();
</script>
</body>
</html>
