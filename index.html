<title>キングショット 連凸計算</title>
<style>
  :root{
    --bg:#060912; --bg2:#0d1630;
    --panel:rgba(22,30,50,.72); --panel2:rgba(30,40,66,.78); --inset:#05080f;
    --line:rgba(148,170,210,.16); --line2:rgba(148,170,210,.28);
    --text:#f1f4fa; --sub:#8b97b0;
    --gold:#f5c84c; --gold2:#d99a1e; --gold-l:#ffe9a8; --gold-d:rgba(245,200,76,.12);
    --r1:#3cc4ff; --r2:#ff5470; --r3:#4ade80; --ok:#34e39a; --err:#ff5c6c;
    --fs:1; --gap:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;color:var(--text)}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(60,110,220,.28), transparent 60%),
      radial-gradient(70% 40% at 100% 100%, rgba(245,200,76,.07), transparent 70%),
      linear-gradient(180deg,var(--bg2) 0%,var(--bg) 45%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
    padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);
    -webkit-text-size-adjust:100%; font-size:calc(15px * var(--fs));
  }
  button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  .wrap{margin:0 auto;max-width:480px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:.02em}

  /* デバイス切替 */
  .device{display:flex;gap:4px;background:rgba(10,15,28,.7);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:18px}
  .device button{flex:1;border:0;background:transparent;color:var(--sub);font-size:12px;padding:6px 2px;border-radius:7px;white-space:nowrap}
  .device button.on{background:linear-gradient(180deg,rgba(245,200,76,.18),rgba(245,200,76,.06));color:var(--gold-l);box-shadow:inset 0 0 0 1px rgba(245,200,76,.35)}
  .device .cur{font-size:10px}

  .ver{text-align:right;font-size:12px;color:var(--gold);letter-spacing:.08em;opacity:.85;margin:2px 2px -4px}
  h1{font-size:calc(20px * var(--fs));margin:6px 0 10px;text-align:center;font-weight:900;letter-spacing:.08em;
     text-shadow:0 2px 12px rgba(60,120,255,.35)}
  h1 span{background:linear-gradient(180deg,var(--gold-l),var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}

  .grid{display:block}
  .col > * + *{margin-top:var(--gap)}

  /* セクション見出し */
  .sec > * + *{margin-top:7px}
  .col > .sec + .sec, .grid > .col + .col{margin-top:20px}
  .sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:calc(15px * var(--fs));letter-spacing:.06em}
  .sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(245,200,76,.55),rgba(245,200,76,0))}
  .sec-h .no{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:6px;transform:rotate(45deg);
    background:linear-gradient(135deg,var(--gold-l),var(--gold) 50%,var(--gold2));color:#1b1200;font-size:calc(12px * var(--fs));font-weight:900;
    box-shadow:0 0 10px rgba(245,200,76,.35);margin:0 3px}
  .sec-h .no > i{transform:rotate(-45deg);font-style:normal}

  /* 共通パネル（左に色帯） */
  .in,.arr,.card{
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--r1);border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .in.r2,.arr.r2,.card.r2{border-left-color:var(--r2)}
  .in.r1,.arr.r1,.card.r1{background:linear-gradient(90deg,rgba(60,196,255,.10),transparent 55%),var(--panel)}
  .in.r2,.arr.r2,.card.r2{background:linear-gradient(90deg,rgba(255,84,112,.10),transparent 55%),var(--panel)}

  /* 入力 */
  .inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .in{padding:8px 10px}
  .in label{display:flex;justify-content:space-between;align-items:center;font-size:calc(13px * var(--fs));font-weight:800}
  .in label .tag{display:none}
  .in.r1 label{color:var(--r1)} .in.r2 label{color:var(--r2)}
  .in input{
    width:100%;margin-top:5px;background:var(--inset);color:var(--text);border:1px solid var(--line2);border-radius:10px;
    font-size:calc(30px * var(--fs));font-weight:800;text-align:center;padding:6px 4px;letter-spacing:.12em;outline:none;
    font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);transition:border-color .15s, box-shadow .15s;
  }
  .in input:focus{border-color:var(--gold);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 3px rgba(245,200,76,.18)}
  .in input::placeholder{font-size:calc(12px * var(--fs));letter-spacing:0;font-weight:400;color:#56617a}
  .in.bad input{border-color:var(--err);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 3px rgba(255,92,108,.18)}
  .in .conv{margin-top:4px;text-align:center;font-size:calc(12px * var(--fs));color:var(--sub);min-height:1.3em}
  .in.bad .conv{color:var(--err)}

  /* 着弾設定 */
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .modes button{
    background:rgba(14,20,36,.8);border:1px solid var(--line2);border-radius:12px;padding:9px 4px;min-height:52px;
    font-size:calc(13px * var(--fs));font-weight:700;line-height:1.25;color:var(--sub);transition:all .15s
  }
  .modes button.on{
    background:linear-gradient(180deg,rgba(245,200,76,.34),rgba(245,200,76,.10));border-color:var(--gold);color:var(--gold-l);
    box-shadow:0 0 14px rgba(245,200,76,.25), inset 0 1px 0 rgba(255,233,168,.25)
  }
  .modes button.on::before{content:"✔ "}

  /* 着弾時間 */
  .arrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .arr{padding:6px 9px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
  .arr .k{font-size:calc(11px * var(--fs));color:var(--sub);width:100%}
  .arr .v{font-size:calc(20px * var(--fs));font-weight:800}

  /* 集結時間（外枠なし） */
  .result{background:none;border:0;padding:0}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:9px 10px}
  .card .name{font-weight:800;font-size:calc(14px * var(--fs))}
  .card.r1 .name{color:var(--r1)} .card.r2 .name{color:var(--r2)}
  .card .big{font-size:calc(34px * var(--fs));font-weight:900;line-height:1.15;text-align:center;margin:4px 0 2px;color:var(--text)}
  .card .big.pos{background:linear-gradient(180deg,var(--gold-l),var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 8px rgba(245,200,76,.35))}
  .first[hidden]{display:none !important}
  .first{display:inline-block;font-size:calc(10px * var(--fs));background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#1b1200;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:2px}
  .arr .first{margin-left:0}
  .explain{margin-top:8px;background:rgba(5,8,15,.75);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:calc(13px * var(--fs));line-height:1.55;text-align:center;color:#cfd6e4}
  .explain .em{color:var(--gold);font-weight:800}
  .result.err .explain{color:var(--err);border-color:rgba(255,92,108,.4)}

  /* コピー */
  .copy{
    position:relative;overflow:hidden;width:100%;border:0;border-radius:14px;padding:16px 8px;font-size:calc(20px * var(--fs));font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#ffe28a 0%,#f5c84c 40%,#d99a1e 100%);color:#1b1200;
    box-shadow:0 4px 0 #8a5c00,0 8px 24px rgba(245,200,76,.28), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .copy::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
  @keyframes shine{0%,70%{left:-60%}100%{left:130%}}
  .copy:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5c00,0 4px 12px rgba(245,200,76,.25)}
  .copy.done{background:linear-gradient(180deg,#7ff5bd,#34e39a 50%,#1fae6f);box-shadow:0 4px 0 #11663f,0 8px 24px rgba(52,227,154,.28)}
  .copy:disabled{background:#2a3140;color:#6b7488;box-shadow:none}
  .copy:disabled::after{display:none}
  .manual{display:none;background:var(--panel);border:1px dashed var(--gold);border-radius:12px;padding:8px}
  .manual.show{display:block}
  .manual p{margin:0 0 6px;font-size:calc(12px * var(--fs));color:var(--gold)}
  .manual textarea{width:100%;min-height:96px;background:var(--inset);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px;font-size:15px;font-family:inherit;resize:vertical}
  .reset{width:100%;background:rgba(10,15,28,.6);border:1px solid var(--line2);border-radius:12px;padding:10px;font-size:calc(15px * var(--fs));color:var(--sub);font-weight:700;letter-spacing:.06em}
  .reset:active{background:var(--panel2);color:var(--text)}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;
    background:linear-gradient(180deg,#7ff5bd,#34e39a);color:#00301a;font-weight:900;padding:12px 22px;border-radius:999px;transition:.25s;pointer-events:none;z-index:9;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== タブレット ===== */
  body.d-tablet{--fs:1.18;--gap:14px}
  body.d-tablet .wrap{max-width:760px}
  body.d-tablet .device button{font-size:14px;padding:8px}
  body.d-tablet .modes button{min-height:62px}
  body.d-tablet .card{padding:12px}
  body.d-tablet .col > .sec + .sec, body.d-tablet .grid > .col + .col{margin-top:26px}

  /* ===== PC ===== */
  body.d-pc{--fs:1.1;--gap:14px;padding-top:16px;padding-bottom:24px}
  body.d-pc .wrap{max-width:820px}
  body.d-pc h1{font-size:28px;margin:10px 0 18px}
  body.d-pc .col > .sec + .sec, body.d-pc .grid > .col + .col{margin-top:24px}
  body.d-pc .copy:hover:not(:disabled){filter:brightness(1.06)}
  body.d-pc .modes button:hover:not(.on),body.d-pc .reset:hover{border-color:rgba(245,200,76,.5);color:var(--text)}
  body.d-pc .kbd{display:inline}
  .kbd{display:none;color:var(--sub);font-size:11px;font-weight:400}

  /* ===== 3凸対応 ===== */
  .in.r3,.arr.r3,.card.r3{border-left-color:var(--r3);background:linear-gradient(90deg,rgba(74,222,128,.10),transparent 55%),var(--panel)}
  .in.r3 label,.card.r3 .name{color:var(--r3)}
  .arr.r1 .rn{color:var(--r1)} .arr.r2 .rn{color:var(--r2)} .arr.r3 .rn{color:var(--r3)}
  .inputs,.cards{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
  body.n3 .in input{font-size:calc(25px * var(--fs));letter-spacing:.06em;padding:7px 2px}
  body.n3 .card .big{font-size:calc(27px * var(--fs))}
  body.n3 .in{padding:7px 7px}
  body.n3 .card{padding:8px 7px}
  .hide{display:none !important}
  .in label,.card .name{font-size:calc(17px * var(--fs)) !important;font-weight:900}
  /* 凸数切替 */
  .cnt{margin-left:auto;display:flex;background:rgba(10,15,28,.7);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px}
  .cnt button{border:0;background:transparent;color:var(--sub);font-weight:800;font-size:calc(12px * var(--fs));padding:4px 11px;border-radius:7px;letter-spacing:.04em}
  .cnt button.on{background:linear-gradient(180deg,rgba(245,200,76,.34),rgba(245,200,76,.10));color:var(--gold-l);box-shadow:inset 0 0 0 1px rgba(245,200,76,.5)}
  .sec-h.has-ctl::after{display:none}
  /* 着弾順 */
  .arrs{display:flex;flex-direction:column;gap:6px}
  .arr{flex-wrap:nowrap;padding:5px 8px;gap:8px}
  .arr .rn{font-weight:900;font-size:calc(18px * var(--fs));width:1.4em;text-align:center;flex:none}
  .rank{display:flex;gap:4px;flex:none}

  .rank button.on{background:linear-gradient(180deg,rgba(245,200,76,.4),rgba(245,200,76,.12));border-color:var(--gold);color:var(--gold-l);box-shadow:0 0 10px rgba(245,200,76,.25)}
  .arr .at{margin-left:auto;text-align:right;line-height:1.1}
  .arr .at .k{display:block;font-size:calc(10px * var(--fs));color:var(--sub)}
  .arr .at .v{font-size:calc(19px * var(--fs));font-weight:800}
  .arr .lag{display:block;font-size:calc(10px * var(--fs));color:var(--gold);min-height:1.1em}
  .same{width:100%;background:rgba(10,15,28,.6);border:1px solid var(--line2);border-radius:10px;padding:7px;font-size:calc(13px * var(--fs));font-weight:700;color:var(--sub)}
  .same.on{border-color:var(--gold);color:var(--gold-l);background:linear-gradient(180deg,rgba(245,200,76,.25),rgba(245,200,76,.06))}
  .gap-note{font-size:calc(11px * var(--fs));color:var(--sub);font-weight:400;letter-spacing:0}
  body.d-tablet .rank button,body.d-pc .rank button{width:40px;height:40px}
  .wrap > .sec + .sec{margin-top:16px}
  body.d-tablet .wrap > .sec + .sec{margin-top:26px}
  body.d-pc .wrap > .sec + .sec{margin-top:24px}
  body.d-phone .rank button{width:31px;height:31px}
  body.d-phone .arr{padding:3px 8px}
  body.d-phone .arrs{gap:5px}
  body.d-phone .same{padding:6px}
  body.d-phone .explain{padding:6px 8px;font-size:12px}
  body.d-phone h1{margin:2px 0 6px}
  /* ===== メモ（英雄遠征スキル） ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 -4px}
  .topbar .ver{margin:0}
  .memo-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(10,15,28,.7);border:1px solid rgba(245,200,76,.45);color:var(--gold-l);
    font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.04em}
  .memo-btn:active{background:rgba(245,200,76,.18)}
  .memo-ov{position:fixed;inset:0;z-index:20;background:rgba(2,4,10,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 12px) 10px calc(env(safe-area-inset-bottom) + 12px)}
  .memo-ov[hidden]{display:none}
  .memo-box{width:100%;max-width:640px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:#0c1222;border:1px solid rgba(245,200,76,.4);
    border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:12px 12px 16px}
  .memo-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-12px;background:#0c1222;padding:4px 0 8px;margin-top:-4px;z-index:1}
  .memo-head h2{margin:0;font-size:18px;font-weight:900;letter-spacing:.06em;color:var(--gold-l)}
  .memo-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);font-size:18px;font-weight:700}
  .memo-sec{margin-top:10px}
  .memo-sec h3{margin:0 0 6px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
  .memo-sec.atk h3{color:#ff8a65} .memo-sec.def h3{color:#5ec8ff}
  .memo-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .memo-tbl th{color:var(--sub);font-weight:700;font-size:11px;text-align:left;padding:5px 4px;border-bottom:1px solid var(--line2);white-space:nowrap}
  .memo-tbl td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  .memo-tbl tr:nth-child(even) td{background:rgba(255,255,255,.025)}
  .memo-tbl td.hero{font-weight:800;white-space:nowrap}
  .memo-tbl td.c{text-align:center;white-space:nowrap}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;white-space:nowrap}
  .tag.atk{background:rgba(255,138,101,.16);color:#ffab91} .tag.def{background:rgba(94,200,255,.16);color:#8fdaff} .tag.both{background:rgba(245,200,76,.18);color:var(--gold-l)}
  .tag.ally{background:rgba(52,227,154,.14);color:#6ff0b6} .tag.enemy{background:rgba(255,84,112,.16);color:#ff8fa3}
  .tag.prob{background:rgba(167,139,250,.18);color:#c4b5fd}
  body.memo-open{overflow:hidden}
  /* ===== 行の高さを詰める（1.行軍時間・3.集結時間） ===== */
  .in{padding:5px 8px !important}
  .in label{line-height:1.1}
  .in label,.card .name{font-size:calc(14px * var(--fs)) !important}
  .in input{margin-top:3px;padding:3px 2px !important;font-size:calc(24px * var(--fs)) !important;border-radius:8px}
  body.n3 .in input{font-size:calc(21px * var(--fs)) !important}
  .in .conv{margin-top:2px;font-size:calc(11px * var(--fs));min-height:0;line-height:1.2}
  .card{padding:5px 9px !important;display:flex;align-items:center;justify-content:space-between;gap:4px}
  .card .name{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
  .card .name .first{margin-left:2px}
  .card .big{font-size:calc(26px * var(--fs)) !important;margin:0 !important;line-height:1.15}
  body.n3 .card{padding:5px 6px !important}
  body.n3 .card .big{font-size:calc(21px * var(--fs)) !important}
  .first{white-space:nowrap}
  body.n3 .card .name{flex-wrap:nowrap;flex:none}
  body.n3 .card .first{font-size:9px;padding:1px 3px;margin-left:1px}
  body.n3 .card .big{letter-spacing:0}
  /* 3.集結時間を少し高く、2.着弾時間を少し小さく */
  .card{padding:9px 10px !important}
  body.n3 .card{padding:9px 6px !important}
  .card .big{font-size:calc(30px * var(--fs)) !important}
  body.n3 .card .big{font-size:calc(23px * var(--fs)) !important}
  .arr .at .v{font-size:calc(16px * var(--fs)) !important}
  .arr .at .k,.arr .lag{font-size:calc(9.5px * var(--fs)) !important}
  /* ===== 最終結論（出発・着弾）を大きく太く ===== */
  .explain{font-size:calc(16px * var(--fs)) !important;font-weight:800;line-height:1.6;color:var(--text);padding:8px 10px !important;text-align:left}
  .explain .lbl{display:inline-block;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#1b1200;border-radius:6px;padding:0 7px;margin-right:6px;font-size:.85em;font-weight:900;vertical-align:1px}
  .explain .ln{display:block}
  .explain .ln + .ln{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line2)}
  .explain .em{font-weight:900}
  body.n3 .explain{font-size:calc(15px * var(--fs)) !important}
  .memo-tabs{display:flex;gap:4px;background:rgba(10,15,28,.8);border:1px solid var(--line2);border-radius:10px;padding:3px}
  .memo-tabs button{border:0;background:transparent;color:var(--sub);font-weight:800;font-size:13px;padding:7px 11px;border-radius:7px;white-space:nowrap}
  .memo-tabs button.on{background:linear-gradient(180deg,rgba(245,200,76,.34),rgba(245,200,76,.10));color:var(--gold-l);box-shadow:inset 0 0 0 1px rgba(245,200,76,.5)}
  .memo-title{margin:4px 0 0;font-size:17px;font-weight:900;letter-spacing:.04em;color:var(--gold-l)}
  .memo-tbl .sec-row th{text-align:left;font-size:14px;font-weight:900;padding:12px 4px 6px;border-bottom:1px solid var(--line2);background:none !important;white-space:normal}
  .memo-tbl .sec-row.atk th{color:#ff8a65} .memo-tbl .sec-row.def th{color:#5ec8ff}
  .memo-tbl thead th{position:sticky;top:var(--mh,44px);background:#0c1222;z-index:1}
  .memo-title{margin-bottom:6px !important}
  .memo-tabs button{padding:7px 9px !important;font-size:12.5px !important}
  .memo-tbl.eq td.lv{white-space:nowrap;line-height:1.25}
  .memo-tbl.eq .equip{display:block;font-weight:700;color:var(--text)}
  .memo-tbl.eq .skill{display:block;font-size:.9em;color:#c9b8ff;margin-top:1px}
  .memo-head h2 small,.memo-title small{font-size:12px;font-weight:700;color:var(--sub);margin-left:2px}
  .memo-tbl th.c{text-align:center}
  .memo-tbl td.lv{font-weight:900;color:var(--gold-l);font-variant-numeric:tabular-nums}
  body.d-phone .memo-box{padding:10px 8px 14px}
  body.d-phone .memo-tbl{font-size:11.5px}
  body.d-phone .memo-tbl td,body.d-phone .memo-tbl th{padding:6px 2px}
  body.d-phone .memo-tbl .tag{padding:1px 4px;font-size:10.5px}
  body.d-tablet .memo-tbl,body.d-pc .memo-tbl{font-size:14px}
  /* 専用装備・スキルを横並び（別の列）に */
  .memo-tbl.eq td.equip{font-weight:700;color:var(--text);white-space:nowrap}
  .memo-tbl.eq td.skill{color:#c9b8ff;white-space:nowrap}
  /* 英雄名の前を1マス空ける */
  .memo-tbl td.hero,.memo-tbl thead th:first-child{padding-left:1em !important}
  /* 画面幅に収まらない場合は表だけ横スクロール */
  .tbl-wrap{overflow:visible}
  .memo-tbl.eq td.equip,.memo-tbl.eq td.skill{display:table-cell;margin:0}
  /* タブ名が長いので、スマホでは折り返して3つとも画面内に収める */
  .memo-head{gap:8px}
  .memo-tabs{flex:1;min-width:0}
  .memo-tabs button{flex:1;min-width:0;white-space:normal;line-height:1.25}
  .memo-close{flex:none}
  body.d-phone .memo-tabs button{font-size:11.5px !important;padding:6px 4px !important}
  body.d-phone .memo-tbl.eq{font-size:11px}
  body.d-phone .memo-tbl.eq td,body.d-phone .memo-tbl.eq th{padding-left:2px;padding-right:2px}
  body.d-phone .memo-tbl.eq td.equip,body.d-phone .memo-tbl.eq td.skill{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
  body.d-phone .memo-tbl.eq td.lv{font-size:11px}
  body.d-phone .memo-tbl.eq th{font-size:10px}
  /* ===== 文字サイズ調整 ===== */
  /* 英雄遠征スキル：効果列を小さく（スマホでは1行に収める） */
  .memo-tbl:not(.eq) td.eff{font-size:.9em}
  body.d-phone .memo-tbl:not(.eq) td.eff{font-size:10.5px;white-space:nowrap;letter-spacing:-.02em}
  /* 専用装備（遠征・討伐）：専用装備名・スキル名・効果を小さく */
  .memo-tbl.eq td.equip,.memo-tbl.eq td.skill,.memo-tbl.eq td.eff{font-size:.88em}
  body.d-phone .memo-tbl.eq td.equip,body.d-phone .memo-tbl.eq td.skill,body.d-phone .memo-tbl.eq td.eff{font-size:10px;letter-spacing:-.02em}
  /* スマホ：専用装備の表は列幅を固定（長い名前は列の中で2行まで折り返す） */
  body.d-phone .memo-tbl.eq{table-layout:fixed}
  body.d-phone .memo-tbl.eq thead th:nth-child(1){width:19%}
  body.d-phone .memo-tbl.eq thead th:nth-child(2){width:18%}
  body.d-phone .memo-tbl.eq thead th:nth-child(3){width:23%}
  body.d-phone .memo-tbl.eq thead th:nth-child(4){width:11%}
  body.d-phone .memo-tbl.eq thead th:nth-child(5){width:19%}
  body.d-phone .memo-tbl.eq thead th:nth-child(6){width:10%}
  body.d-phone .memo-tbl.eq td.equip,body.d-phone .memo-tbl.eq td.skill,body.d-phone .memo-tbl.eq td.eff{white-space:normal;word-break:normal;overflow-wrap:anywhere;line-height:1.3}
  body.d-phone .memo-tbl.eq td.hero{white-space:nowrap;overflow:hidden}
  body.d-phone .memo-tbl.eq td.lv{font-size:10px !important;letter-spacing:-.03em}
  @media (max-width:385px){
    body.d-phone .memo-tbl:not(.eq) td.eff{font-size:10px}
    body.d-phone .memo-tbl:not(.eq) td.lv{font-size:10.5px;letter-spacing:-.03em}
    body.d-phone .memo-tbl:not(.eq) .tag{font-size:9.5px;padding:1px 3px}
    body.d-phone .memo-tbl:not(.eq) td,body.d-phone .memo-tbl:not(.eq) th{padding-left:1px;padding-right:1px}
    body.d-phone .memo-tbl:not(.eq) td.hero{font-size:11px}
    body.d-phone .memo-tbl.eq td.equip,body.d-phone .memo-tbl.eq td.skill,body.d-phone .memo-tbl.eq td.eff{font-size:9.5px}
    body.d-phone .memo-tbl.eq thead th:nth-child(1){width:21%}
    body.d-phone .memo-tbl.eq thead th:nth-child(2){width:17%}
    body.d-phone .memo-tbl.eq thead th:nth-child(3){width:22%}
    body.d-phone .memo-tbl.eq thead th:nth-child(4){width:10%}
    body.d-phone .memo-tbl.eq thead th:nth-child(5){width:18%}
    body.d-phone .memo-tbl.eq thead th:nth-child(6){width:12%}
    body.d-phone .memo-tbl.eq td.hero{font-size:10.5px;padding-left:.8em !important}
    body.d-phone .memo-tbl.eq td.lv{font-size:9.5px !important}
  }
  /* ===== 専用装備（遠征・討伐）：スマホでも改行しないよう、装備名・スキル名・効果を小さく ===== */
  body.d-phone .memo-tbl.eq{table-layout:auto}
  body.d-phone .memo-tbl.eq thead th{width:auto !important}
  body.d-phone .memo-tbl.eq td.equip,body.d-phone .memo-tbl.eq td.skill,body.d-phone .memo-tbl.eq td.eff{
    white-space:nowrap !important;font-size:clamp(8px,2.4vw,10.5px) !important;letter-spacing:-.03em;line-height:1.3}
  body.d-phone .memo-tbl.eq td.hero{font-size:clamp(9.5px,2.75vw,11.5px) !important}
  body.d-phone .memo-tbl.eq .tag{font-size:9px !important;padding:1px 3px !important}
  body.d-phone .memo-tbl.eq td,body.d-phone .memo-tbl.eq th{padding-left:2px !important;padding-right:2px !important}
  body.d-phone .memo-tbl.eq td.hero,body.d-phone .memo-tbl.eq thead th:first-child{padding-left:.8em !important}
  @media (max-width:350px){
    body.d-phone .memo-tbl.eq td.hero,body.d-phone .memo-tbl.eq thead th:first-child{padding-left:.5em !important}
    body.d-phone .memo-tbl.eq td,body.d-phone .memo-tbl.eq th{padding-left:1px !important;padding-right:1px !important}
  }
  /* ===== Ver3.0 専用装備：世代・確率・条件の列 ===== */
  .memo-tbl.eq td.gen{color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
  .memo-tbl.eq td.hero{padding-left:.4em !important}
  .memo-tbl.eq thead th:first-child{padding-left:4px !important}
  .memo-tbl.eq td.prob-c{color:#c4b5fd;font-weight:800;white-space:nowrap}
  .memo-tbl.eq td.cond{font-size:.82em;color:#9fb3d1;white-space:nowrap}
  .memo-tbl.eq td.eff,.memo-tbl.eq td.lv,.memo-tbl.eq td.cond{line-height:1.3}
  .memo-tbl.eq td{white-space:nowrap}
  body.d-phone .memo-tbl.eq td.gen,body.d-phone .memo-tbl.eq td.prob-c,body.d-phone .memo-tbl.eq td.cond{font-size:clamp(8px,2.3vw,10px) !important}
  body.d-phone .memo-tbl.eq td.hero{padding-left:.3em !important}
  body.d-phone .memo-tbl.eq thead th:first-child{padding-left:2px !important}
  /* PC・タブレット：メモ画面を広げて表を1行で表示 */
  body.d-pc .memo-box,body.d-tablet .memo-box{max-width:960px}
  /* スマホ：入りきらない時だけ、装備名・スキル名・効果・条件をマスの中で折り返す */
  body.d-phone .memo-box .memo-tbl.eq td.equip,body.d-phone .memo-box .memo-tbl.eq td.skill,
  body.d-phone .memo-box .memo-tbl.eq td.eff,body.d-phone .memo-box .memo-tbl.eq td.cond{white-space:normal !important;overflow-wrap:anywhere}
  body.d-tablet .memo-box .memo-tbl.eq td.eff,body.d-tablet .memo-box .memo-tbl.eq td.cond{white-space:normal !important}
  body.d-phone .memo-box .memo-tbl.eq td,body.d-phone .memo-box .memo-tbl.eq th{padding-left:1.5px !important;padding-right:1.5px !important}
  /* 最大列：スマホ・タブレットでは入りきらない時だけ折り返す */
  body.d-phone .memo-box .memo-tbl.eq td.lv,body.d-tablet .memo-box .memo-tbl.eq td.lv{white-space:normal !important}
  /* 遠征スキル表の効果は短いので1行のまま */
  body.d-phone .memo-box .memo-tbl.eq.exp td.eff{white-space:nowrap !important}
  /* ===== Ver3.2 項目名の行を各区分（攻撃系・防衛系）の下に表示 ===== */
  .memo-tbl tr.col-head th{background:none !important;position:static;padding-top:4px;padding-bottom:4px}
  .memo-tbl tr.col-head th:first-child{padding-left:1em !important}
  .memo-tbl tr.col-head + tr td{border-top:0}
  body.d-phone .memo-tbl tr.col-head th{font-size:10px}
  .memo-tbl.eq tr.col-head th:first-child{padding-left:4px !important}
  body.d-phone .memo-tbl.eq tr.col-head th:first-child{padding-left:2px !important}
</style>
</head>
<body>
<div class="wrap" style="--n:2">
  <div class="topbar">
    <button class="memo-btn" id="memoBtn" aria-haspopup="dialog">📝 英雄スキル情報</button>
    <div class="ver">@kai@ 2026/11/24 Ver3.7</div>
  </div>
  <h1>キングショット <span>連凸計算</span></h1>

  <section class="sec">
    <div class="sec-h has-ctl"><span class="no"><i>1</i></span>行軍時間
      <div class="cnt" role="radiogroup" aria-label="凸数">
        <button data-n="2" role="radio">2凸</button>
        <button data-n="3" role="radio">3凸</button>
      </div>
    </div>
    <div class="inputs" id="inputs"></div>
  </section>

  <section class="sec">
    <div class="sec-h"><span class="no"><i>2</i></span>着弾時間 <span class="gap-note">着弾順を選択（2秒間隔）</span></div>
    <div class="arrs" id="arrs"></div>
    <button class="same" id="sameBtn">同時着弾にする</button>
  </section>

  <section class="sec">
    <div class="sec-h"><span class="no"><i>3</i></span>集結時間</div>
    <div class="result" id="result">
      <div class="cards" id="cards"></div>
      <div class="explain" id="explain"></div>
    </div>
  </section>

  <div class="sec" style="margin-top:14px">
    <button class="copy" id="copyBtn">📋 計算結果コピー (同チャ貼付用) <span class="kbd">(Ctrl+Enter)</span></button>
    <div class="manual" id="manual">
      <p>自動コピーできませんでした。下の文字を長押し（またはCtrl+C）でコピーしてください。</p>
      <textarea id="manualText" readonly></textarea>
    </div>
    <button class="reset" id="resetBtn">↺ リセット</button>
  </div>

  <div class="device" role="group" aria-label="表示切替">
    <button data-dev="auto">自動 <span class="cur" id="autoCur"></span></button>
    <button data-dev="phone">📱 スマホ</button>
    <button data-dev="tablet">📲 タブレット</button>
    <button data-dev="pc">💻 PC</button>
  </div>
</div>
<div class="toast" id="toast">コピーしました！</div>
<div class="memo-ov" id="memoOv" hidden role="dialog" aria-modal="true" aria-labelledby="memoTitle">
  <div class="memo-box">
    <div class="memo-head">
      <div class="memo-tabs" role="tablist">
        <button role="tab" data-tab="0" class="on">集結&駐屯参加<br>英雄<br>遠征スキル</button>
        <button role="tab" data-tab="1">集結&駐屯参加<br>英雄専用装備<br>遠征スキル</button>
        <button role="tab" data-tab="2">集結&駐屯主&単騎<br>英雄専用装備<br>討伐スキル</button>
      </div>
      <button class="memo-close" id="memoClose" aria-label="閉じる">✕</button>
    </div>
    <h2 id="memoTitle" class="memo-title"></h2>
    <div id="memoBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MAX = 3;
  var LEAD = 2;                 // 着弾順1つごとの間隔（秒）
  var RESET_VAL = "00:00";      // リセット時の行軍時間
  var INIT = ["05:01", "04:56", "04:50"];
  var ZD = ["０","１","２","３","４","５","６","７","８","９"];
  var DEFAULT_N = 2;            // 標準の凸数
  var n = DEFAULT_N;            // 凸数
  var rank = [1, 1, 1];         // 着弾順（1=最初）
  var latestCopyText = "";

  /* ---------- 計算ロジック ---------- */
  function parse4(str){
    if (!/^\d{4}$/.test(str)) return null;
    var m = parseInt(str.slice(0,2),10), s = parseInt(str.slice(2),10);
    if (s > 59) return null;
    return m*60 + s;
  }
  function pad(x){ return (x < 10 ? "0" : "") + x; }
  function fmtMS(sec){ return pad(Math.floor(sec/60)) + ":" + pad(sec%60); }
  // t: 行軍秒の配列, rk: 着弾順の配列
  // 着弾 = 基準A + (順位-1)×LEAD、出発 = 着弾 − 行軍。最初に出発する集結を 00:00 にする
  function calc(t, rk){
    var off = rk.map(function(r){ return (r - 1) * LEAD; });
    // 一番早い着弾順を基準(0秒)に詰める（全員②なら同時着弾と同じ）
    var minOff = Math.min.apply(null, off);
    off = off.map(function(o){ return o - minOff; });
    var A = -Infinity;
    for (var i=0;i<t.length;i++) A = Math.max(A, t[i] - off[i]);
    return t.map(function(ti, i){ return { dep: A + off[i] - ti, arr: A + off[i], off: off[i] }; });
  }
  function zen(str){
    return str.replace(/[0-9]/g, function(c){ return ZD[+c]; }).replace(/:/g, "：");
  }
  var CN = ["⓪","①","②","③"];  // 丸数字
  // 秒数の表記：1桁は全角（８）、2桁以上は半角（33）
  function secNum(x){ return x < 10 ? ZD[x] : String(x); }
  function secTxt(x){
    if (x < 60) return secNum(x) + "秒後";
    var m = Math.floor(x/60), sc = x % 60;
    return secNum(m) + "分" + (sc ? secNum(sc) + "秒" : "") + "後";
  }
  // 順番の表記（例 ③→ ②８秒後→①33秒後）。同じタイミングは「＝」、最初は秒数なし
  function orderLine(vals){
    var uq = vals.filter(function(v,i){ return vals.indexOf(v) === i; }).sort(function(a,b){ return a-b; });
    var parts = uq.map(function(u, k){
      var g = []; vals.forEach(function(v,i){ if (v === u) g.push(CN[i+1]); });
      return g.join("＝") + (k ? secTxt(u - uq[0]) : "");
    });
    return parts[0] + (parts.length > 1 ? "→" + parts.slice(1).join("→") : "");
  }
  // チャットで改行されないよう、時間は半角（例 05:01）で出力
  function buildCopy(t, r){
    var S = "\u3000";
    var head = "・領主", dp = "●集結", mv = "・行軍", ar = "・着弾";
    for (var i=0;i<t.length;i++){
      head += S + S + CN[i+1];
      dp += S + fmtMS(r[i].dep);
      mv += S + fmtMS(t[i]);
      ar += S + fmtMS(r[i].arr);
    }
    return "【連凸タイミング】\n" +
      "【出発】" + orderLine(r.map(function(x){ return x.dep; })) + "\n" +
      "【着弾】" + orderLine(r.map(function(x){ return x.arr; })) + "\n" +
      head + "\n" + dp + "\n" + mv + "\n" + ar + "\n";
  }
  window.RentotsuCalc = { parse4:parse4, fmtMS:fmtMS, calc:calc, buildCopy:buildCopy };

  /* ---------- 画面の組み立て ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var inputsEl = $("inputs"), arrsEl = $("arrs"), cardsEl = $("cards");
  for (var i=1;i<=MAX;i++){
    inputsEl.insertAdjacentHTML("beforeend",
      '<div class="in r'+i+'" id="box'+i+'"><label for="t'+i+'"><span>'+i+'</span></label>' +
      '<input id="t'+i+'" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例：0308" value="'+INIT[i-1]+'">' +
      '<div class="conv num" id="c'+i+'"></div></div>');
    arrsEl.insertAdjacentHTML("beforeend",
      '<div class="arr r'+i+'" id="row'+i+'"><span class="rn">'+i+'</span>' +
      '<div class="rank" data-i="'+(i-1)+'"><button data-r="1">①</button><button data-r="2">②</button><button data-r="3" class="r3b">③</button></div>' +
      '<div class="at"><span class="k">着弾</span><span class="v num" id="a'+i+'">--:--</span><span class="lag" id="l'+i+'"></span></div></div>');
    cardsEl.insertAdjacentHTML("beforeend",
      '<div class="card r'+i+'" id="card'+i+'"><div class="name">'+i+'<span class="first" id="f'+i+'" hidden>先発</span></div>' +
      '<div class="big num" id="d'+i+'">--:--</div></div>');
  }
  var inputs = [$("t1"), $("t2"), $("t3")];
  var copyBtn = $("copyBtn");

  function sanitize(el){
    var v = el.value.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
                    .replace(/[^0-9]/g,"");
    var prev = el.getAttribute("data-prev") || "";
    if (v.length > 4) v = (prev.length === 4 && v.indexOf(prev) === 0) ? v.slice(4, 8) : v.slice(0, 4);
    el.setAttribute("data-prev", v);
    var shown = (v.length === 4 && parse4(v) !== null) ? v.slice(0,2) + ":" + v.slice(2) : v;
    if (shown !== el.value) el.value = shown;
    return v;
  }
  function inputState(raw, box, conv){
    var sec = parse4(raw);
    if (sec === null){
      box.classList.add("bad");
      if (raw.length < 4) conv.textContent = raw.length === 0 ? "入力してください" : "4桁で入力";
      else conv.textContent = "秒は00〜59";
    } else {
      box.classList.remove("bad");
      conv.textContent = Math.floor(sec/60) + "分" + (sec%60) + "秒";
    }
    return sec;
  }
  function gapTxt(x){ return x >= 60 ? Math.floor(x/60) + "分" + (x%60 ? (x%60) + "秒" : "") : x + "秒"; }

  function render(){
    // 凸数の反映
    document.body.classList.toggle("n3", n === 3);
    document.querySelector(".wrap").style.setProperty("--n", n);
    for (var i=1;i<=MAX;i++){
      var show = i <= n;
      $("box"+i).classList.toggle("hide", !show);
      $("row"+i).classList.toggle("hide", !show);
      $("card"+i).classList.toggle("hide", !show);
    }
    document.querySelectorAll(".r3b").forEach(function(b){ b.classList.toggle("hide", n < 3); });
    document.querySelectorAll(".cnt button").forEach(function(b){
      var on = +b.getAttribute("data-n") === n; b.classList.toggle("on", on); b.setAttribute("aria-checked", on);
    });
    document.querySelectorAll(".rank").forEach(function(g){
      var k = +g.getAttribute("data-i");
      g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", +b.getAttribute("data-r") === rank[k]); });
    });
    var rk = rank.slice(0, n);
    $("sameBtn").classList.toggle("on", rk.every(function(r){ return r === rk[0]; }));

    var t = [];
    for (i=0;i<n;i++) t.push(inputState(sanitize(inputs[i]), $("box"+(i+1)), $("c"+(i+1))));
    var res = $("result");
    if (t.some(function(x){ return x === null; })){
      res.classList.add("err");
      for (i=1;i<=MAX;i++){
        $("d"+i).textContent = "--:--"; $("d"+i).classList.remove("pos");
        $("a"+i).textContent = "--:--"; $("l"+i).textContent = ""; $("f"+i).hidden = true;
      }
      $("explain").textContent = "⚠ 入力エラー：行軍時間を4桁（分2桁＋秒2桁、秒は00〜59）で入力してください";
      latestCopyText = ""; copyBtn.disabled = true; $("manual").classList.remove("show");
      return;
    }
    res.classList.remove("err"); copyBtn.disabled = false;
    var r = calc(t, rk);
    var allSameDep = r.every(function(x){ return x.dep === 0; });
    var allSameArr = r.every(function(x){ return x.off === 0; });
    for (i=0;i<n;i++){
      var k = i + 1;
      $("d"+k).textContent = fmtMS(r[i].dep);
      $("d"+k).classList.toggle("pos", r[i].dep > 0);
      $("a"+k).textContent = fmtMS(r[i].arr);
      $("l"+k).textContent = r[i].off > 0 ? "+" + r[i].off + "秒" : (allSameArr ? "" : "先着");
      $("f"+k).hidden = allSameDep || r[i].dep !== 0;
    }

    // 説明文：出発順と着弾
    // 同じ秒数は「1＝2」のようにまとめて表示（出発・着弾とも同じ書式）
    function seq(vals, label){
      var uq = vals.filter(function(v,j){ return vals.indexOf(v) === j; }).sort(function(a,b){ return a-b; });
      return "<span class='ln'><span class='lbl'>" + label + "</span>" + uq.map(function(u){
        var g = []; vals.forEach(function(v,j){ if (v === u) g.push(j+1); });
        // 全員同じタイミング（1グループだけ）なら「（最初）」は付けない
        return g.join("＝") + (u ? "<span class='em'>（" + gapTxt(u) + "後）</span>" : (uq.length > 1 ? "（最初）" : ""));
      }).join(" → ") + "</span>";
    }
    var dep = seq(r.map(function(x){ return x.dep; }), "出発");
    var arr;
    arr = seq(r.map(function(x){ return x.off; }), "着弾");
    $("explain").innerHTML = dep + arr;

    latestCopyText = buildCopy(t, r);
    if ($("manual").classList.contains("show")) $("manualText").value = latestCopyText;
  }

  /* ---------- コピー ---------- */
  var toastTimer;
  function success(){
    $("manual").classList.remove("show");
    var tt = $("toast"); tt.classList.add("show");
    copyBtn.classList.add("done"); copyBtn.firstChild.nodeValue = "✅ コピーしました！ ";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      tt.classList.remove("show"); copyBtn.classList.remove("done");
      copyBtn.firstChild.nodeValue = "📋 計算結果コピー ";
    }, 1600);
  }
  function legacyCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
    document.body.appendChild(ta);
    var ok = false;
    try{
      ta.contentEditable = "true"; ta.readOnly = false;
      var range = document.createRange(); range.selectNodeContents(ta);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      sel.removeAllRanges();
    }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function showManual(text){
    var m = $("manual"), ta = $("manualText");
    ta.value = text; m.classList.add("show");
    setTimeout(function(){ try{ ta.focus(); ta.setSelectionRange(0, text.length); }catch(e){} }, 50);
  }
  function doCopy(){
    render();
    var text = latestCopyText;
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(success, function(){
        if (legacyCopy(text)) success(); else showManual(text);
      });
    } else {
      if (legacyCopy(text)) success(); else showManual(text);
    }
  }

  /* ---------- デバイス表示切替 ---------- */
  var devPref = "auto";
  try{ devPref = localStorage.getItem("rentotsu_device") || "auto"; }catch(e){}
  function autoDevice(){
    var touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
    if (window.innerWidth < 600) return "phone";
    if (touch && window.innerWidth < 1200) return "tablet";
    if (window.innerWidth < 900) return "tablet";
    return "pc";
  }
  var DEV_LABEL = {phone:"📱", tablet:"📲", pc:"💻"};
  function applyDevice(){
    var d = devPref === "auto" ? autoDevice() : devPref;
    document.body.classList.remove("d-phone","d-tablet","d-pc");
    document.body.classList.add("d-" + d);
    $("autoCur").textContent = devPref === "auto" ? DEV_LABEL[d] : "";
    document.querySelectorAll(".device button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-dev") === devPref); });
  }

  /* ---------- イベント ---------- */
  inputs.forEach(function(el, idx){
    el.addEventListener("input", render);
    var selAll = function(){ setTimeout(function(){ try{ el.setSelectionRange(0, el.value.length); }catch(e){} }, 0); };
    el.addEventListener("focus", selAll);
    el.addEventListener("click", selAll);
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter" && !(e.ctrlKey || e.metaKey)){
        e.preventDefault();
        if (idx + 1 < n) inputs[idx + 1].focus(); else el.blur();
      }
    });
  });
  document.querySelectorAll(".rank").forEach(function(g){
    var k = +g.getAttribute("data-i");
    g.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){ rank[k] = +b.getAttribute("data-r"); render(); });
    });
  });
  $("sameBtn").addEventListener("click", function(){ rank = [1,1,1]; render(); });
  document.querySelectorAll(".cnt button").forEach(function(b){
    b.addEventListener("click", function(){
      n = +b.getAttribute("data-n");
      if (n < 3 && rank[2] === 3) rank[2] = 1;
      rank = rank.map(function(r){ return Math.min(r, n); });
      $("manual").classList.remove("show"); render();
    });
  });
  copyBtn.addEventListener("click", doCopy);
  $("resetBtn").addEventListener("click", function(){
    inputs.forEach(function(el){ el.value = RESET_VAL; el.setAttribute("data-prev",""); });
    rank = [1,1,1]; n = DEFAULT_N;
    $("manual").classList.remove("show"); render();
  });
  document.querySelectorAll(".device button").forEach(function(b){
    b.addEventListener("click", function(){
      devPref = b.getAttribute("data-dev");
      try{ localStorage.setItem("rentotsu_device", devPref); }catch(e){}
      applyDevice();
    });
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); doCopy(); }
  });
  window.addEventListener("resize", applyDevice);
  window.addEventListener("orientationchange", applyDevice);

      ["6", "トリトン", "潮汐の杖", "【クリスタル改造】", "攻撃", "与ダメージ上昇", "30%", "", ""],

      ["7", "チャールズ", "正義の鉄拳", "【修理の達人】", "防衛", "HP回復\n防御力上昇", "最大HP35%\n30%", "", "HP50%未満\n1回のみ"],
      ["7", "レン&ロン", "ヘヴィキャノン", "【クールな砲撃手】", "攻撃", "攻撃速度上昇", "14%", "5秒", "ｽｷﾙ発動時"],
      ["8", "ディエゴ", "隕鉄剣", "【重剣無鋒】", "攻防", "防御力上昇\nﾀﾞﾒｰｼﾞ反射", "攻撃力x95%\n被ﾀﾞﾒｰｼﾞx30%", "", ""],
      ["8", "ルナ", "太古の守護者", "【星霊の残光】", "防衛", "5秒間HPキープ", "初期HP30%まで", "", ""],
      ["8", "リズ", "真鍮のメイス", "【スプラッシュバブル】", "攻撃", "攻撃力上昇\n与ﾀﾞﾒｰｼﾞ", "24%\n攻撃力x70%", "", ""]
    ]}
  ];
  var KTAG = function(k){ return '<span class="tag '+(KIND[k]||"")+'">'+esc(k)+'</span>'; };
  // 1ページ＝1つの表（区分は見出し行で区切る）→ 列が上から下までそろう
  // headPerSec=true のときは、項目名の行を表の先頭ではなく「１．攻撃系」「２．防衛系」の各見出し行の下に入れる
  function memoTable(heads, sections, rowFn, cls, headPerSec){
    var n = heads.length;
    var headCells = heads.map(function(h){ return '<th'+(h.c ? ' class="c"' : '')+'>'+h.t+'</th>'; }).join("");
    return '<div class="tbl-wrap"><table class="memo-tbl '+(cls||"")+'">' +
      (headPerSec ? '' : '<thead><tr>' + headCells + '</tr></thead>') + '<tbody>' +
      sections.map(function(sec){
        return (sec.title ? '<tr class="sec-row '+sec.cls+'"><th colspan="'+n+'">'+esc(sec.title)+'</th></tr>' : '') +
          (headPerSec ? '<tr class="col-head">' + headCells + '</tr>' : '') +
          sec.rows.map(rowFn).join("");
      }).join("") + '</tbody></table></div>';
  }
  // 専用装備の表：中身が空の列（例：遠征スキルの「確率」）は自動で非表示
  var EQ_COLS = [
    {t:"世代", c:1, cls:"gen"}, {t:"英雄", cls:"hero"}, {t:"専用装備", cls:"equip"}, {t:"スキル", cls:"skill"},
    {t:"区分", c:1, tag:1}, {t:"効果", cls:"eff"}, {t:"最大", c:1, cls:"lv"}, {t:"確率", c:1, cls:"prob-c"}, {t:"条件", cls:"cond"}
  ];
  function cellHtml(v){ return esc(v).replace(/\n/g, "<br>"); }
  // 全角カタカナ→半角カタカナ（濁点・半濁点・長音「ー」・中点「・」も半角に。漢字・ひらがな・【】はそのまま）
  var KANA_F = "ァアィイゥウェエォオカキクケコサシスセソタチッツテトナニヌネノハヒフヘホマミムメモャヤュユョヨラリルレロワヲンー・";
  var KANA_H = "ｧｱｨｲｩｳｪｴｫｵｶｷｸｹｺｻｼｽｾｿﾀﾁｯﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓｬﾔｭﾕｮﾖﾗﾘﾙﾚﾛﾜｦﾝｰ･";
  function toHankakuKana(str){
    return String(str).replace(/[\u30A1-\u30FC\u30FB]/g, function(ch){
      var d = ch.normalize("NFD"), out = "";
      for (var i=0;i<d.length;i++){
        var c = d[i], k = KANA_F.indexOf(c);
        if (k >= 0) out += KANA_H[k];
        else if (c === "\u3099") out += "ﾞ";
        else if (c === "\u309A") out += "ﾟ";
        else out += c;
      }
      return out;
    });
  }
  function eqTable(sections, kind, headPerSec){
    var use = EQ_COLS.map(function(col, j){
      return sections.some(function(sec){ return sec.rows.some(function(r){ return String(r[j]).trim() !== ""; }); });
    });
    var heads = EQ_COLS.filter(function(c,j){ return use[j]; });
    return memoTable(heads, sections, function(r){
      return '<tr>' + EQ_COLS.map(function(col, j){
        if (!use[j]) return "";
        var v = r[j];
        if (col.tag) return '<td class="c">'+KTAG(v)+'</td>';
        // 最大：「攻撃力x300%」などは、幅が足りない時だけ x の前で折り返す
        if (col.cls === "lv") return '<td class="c lv">'+cellHtml(v).replace(/([^<>\s])(x\d)/g, '$1<wbr>$2')+'</td>';
        // 専用装備名・スキル名の2列だけ、カタカナを半角にして表示
        if (col.cls === "equip" || col.cls === "skill") v = toHankakuKana(v);
        return '<td class="'+(col.c ? "c " : "")+(col.cls||"")+'">'+cellHtml(v)+'</td>';
      }).join("") + '</tr>';
    }, "eq " + (kind||""), headPerSec);
  }
  var MEMO_PAGES = [
    { title:"英雄遠征スキル<small>（集結&駐屯参加スキル）</small>",
      html: memoTable(
        [{t:"英雄"},{t:"区分",c:1},{t:"適用",c:1},{t:"効果"},{t:"最大",c:1},{t:"補足",c:1}],
        MEMO,
        function(r){
          return '<tr><td class="hero">'+esc(r[0])+'</td>' +
            '<td class="c">'+KTAG(r[1])+'</td>' +
            '<td class="c"><span class="tag '+(r[2]==="敵"?"enemy":"ally")+'">'+esc(r[2])+'</span></td>' +
            '<td class="eff">'+esc(r[3])+'</td>' +
            '<td class="c lv">'+esc(r[4])+'</td>' +
            '<td class="c">'+(r[5] ? '<span class="tag prob">'+esc(r[5])+'</span>' : '')+'</td></tr>';
        }, "", true) },
    { title:"英雄専用装備：遠征スキル<small>（集結&駐屯参加スキル）</small>", html: eqTable(EQUIP, "exp", true) },
    { title:"英雄専用装備：討伐スキル<small>（集結&駐屯主/単騎スキル）</small>", html: eqTable(HUNT, "hunt") }
  ];
  var memoTab = 0;
  function showMemoTab(k){
    memoTab = k;
    $("memoTitle").innerHTML = MEMO_PAGES[k].title;
    $("memoBody").innerHTML = MEMO_PAGES[k].html;
    document.querySelectorAll(".memo-tabs button").forEach(function(b){
      var on = +b.getAttribute("data-tab") === k; b.classList.toggle("on", on); b.setAttribute("aria-selected", on);
    });
    document.querySelector(".memo-box").scrollTop = 0;
  }
  document.querySelectorAll(".memo-tabs button").forEach(function(b){
    b.addEventListener("click", function(){ showMemoTab(+b.getAttribute("data-tab")); });
  });
  showMemoTab(0);
  function fitMemoHead(){
    var h = document.querySelector(".memo-head");
    document.querySelector(".memo-box").style.setProperty("--mh", (h.getBoundingClientRect().height - 13) + "px");
  }
  function openMemo(){ $("memoOv").hidden = false; document.body.classList.add("memo-open"); fitMemoHead(); $("memoClose").focus(); }
  window.addEventListener("resize", function(){ if (!$("memoOv").hidden) fitMemoHead(); });
  function closeMemo(){ $("memoOv").hidden = true; document.body.classList.remove("memo-open"); $("memoBtn").focus(); }
  $("memoBtn").addEventListener("click", openMemo);
  $("memoClose").addEventListener("click", closeMemo);
  $("memoOv").addEventListener("click", function(e){ if (e.target === this) closeMemo(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("memoOv").hidden) closeMemo(); });

  applyDevice();
  render();
})();
</script>
